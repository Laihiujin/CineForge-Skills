name: Feature request
description: Propose a scoped production capability.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Production need
      description: What concrete filmmaking problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed contract
      description: Describe inputs, outputs, gates, dependencies, and acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Alternatives and compatibility
